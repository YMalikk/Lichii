
name: Build Lichii Duskbloods PR552

on:
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 180

    steps:
      - name: Checkout PR 552
        uses: actions/checkout@v4
        with:
          repository: zortos293/Lichii
          ref: refs/pull/552/head
          submodules: recursive
          fetch-depth: 1

      - name: Show MSVC toolchain
        shell: pwsh
        run: |
          cmake --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -property installationVersion

      - name: Install Vulkan shader tools
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress

          $sdk = Get-ChildItem "C:\VulkanSDK" -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $sdk) {
            throw "Vulkan SDK installation not found"
          }

          $bin = Join-Path $sdk.FullName "Bin"
          $validator = Join-Path $bin "glslangValidator.exe"

          if (-not (Test-Path $validator)) {
            throw "glslangValidator.exe not found"
          }

          $bin | Out-File -FilePath $env:GITHUB_PATH -Append
          & $validator --version

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DYUZU_TESTS=OFF

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 4

      - name: Package binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null

          $binRoot = (Resolve-Path "build/bin").Path

          Get-ChildItem $binRoot -Recurse -File |
            Where-Object {
              $_.Extension -in @(".exe", ".dll") -or
              $_.FullName -match "plugins|translations"
            } |
            ForEach-Object {
              $relative = $_.FullName.Substring($binRoot.Length + 1)
              $dest = Join-Path artifact $relative

              New-Item -ItemType Directory -Force `
                (Split-Path $dest) | Out-Null

              Copy-Item $_.FullName $dest
            }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Lichii-Duskbloods-PR552-Windows
          path: artifact/
          if-no-files-found: error
